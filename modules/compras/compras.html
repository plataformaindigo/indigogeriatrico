<section class="proveedores-module">

  <div class="proveedores-header">


<div>
  <span class="proveedores-eyebrow">
    Gestión
  </span>

  <h1>
    Proveedores
  </h1>

  <p>
    Administración de proveedores del establecimiento.
  </p>
</div>

<button
  id="btnNuevoProveedor"
  class="proveedores-btn-primary"
>
  + Nuevo proveedor
</button>


  </div>

  <div class="proveedores-stats">


<div class="proveedores-stat-card">
  <span>
    Total
  </span>

  <strong id="totalProveedores">
    0
  </strong>
</div>


<div class="proveedores-stat-card">
  <span>
    Activos
  </span>

  <strong id="proveedoresActivos">
    0
  </strong>
</div>


<div class="proveedores-stat-card">
  <span>
    Inactivos
  </span>

  <strong id="proveedoresInactivos">
    0
  </strong>
</div>


  </div>

  <div class="proveedores-card">


<div class="proveedores-table-header">

  <div>

    <h2>
      Listado de proveedores
    </h2>

    <p>
      Datos de prueba únicamente para navegación.
    </p>

  </div>


  <input
    id="buscarProveedor"
    type="search"
    placeholder="Buscar proveedor..."
  >

</div>


<div class="proveedores-table-wrapper">

  <table>

    <thead>

      <tr>

        <th>
          Proveedor
        </th>

        <th>
          CUIT
        </th>

        <th>
          Rubro
        </th>

        <th>
          Contacto
        </th>

        <th>
          Estado
        </th>

      </tr>

    </thead>


    <tbody id="tablaProveedores">

    </tbody>

  </table>

</div>


  </div>

</section>
