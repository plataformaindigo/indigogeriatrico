<!-- =========================================
     LOGIN
========================================= -->

<div
  id="loginModal"
  class="modal"
>

  <div class="login">

    <h2>
      Iniciar sesión
    </h2>

    <p>
      Ingresá tus credenciales para acceder al sistema.
    </p>


    <div class="field">

      <label>
        Usuario
      </label>

      <input
        id="usuario"
        type="text"
        autocomplete="username"
      >

    </div>


    <div class="field">

      <label>
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

    </div>


    <button
      id="loginButton"
      class="primary"
    >
      Iniciar sesión
    </button>


    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</div>
