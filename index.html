<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Geriátrico | Sistema</title>

<link
  rel="stylesheet"
  href="./css/app.css"
>

</head>

<body>


<!-- =========================================
     BARRA DE NAVEGACIÓN
========================================= -->

<header class="navbar">

<div class="brand">

  <img
    src="./img/logo.jpg"
    alt=""
  >

  <strong>
    INDIGO
  </strong>

</div>


  <nav
    id="navigation"
    class="nav"
  >

    <button
      class="nav-button"
      data-module="sesion"
    >
      🔐 Sesión
    </button>

    <button
      class="nav-button"
      data-module="ocupacion"
    >
      🛏️ Ocupación
    </button>

    <button
      class="nav-button"
      data-module="pacientes"
    >
      👥 Pacientes
    </button>

    <button
      class="nav-button"
      data-module="enfermeria"
    >
      🩺 Enfermería
    </button>

    <button
      class="nav-button"
      data-module="farmacia"
    >
      💊 Farmacia
    </button>

    <button
      class="nav-button"
      data-module="cocina"
    >
      🍽️ Cocina
    </button>

    <button
      class="nav-button"
      data-module="nutricion"
    >
      🥗 Nutrición
    </button>

    <button
      class="nav-button"
      data-module="profesionales"
    >
      👨‍⚕️ Profesionales
    </button>

    <button
      class="nav-button"
      data-module="rrhh"
    >
      👔 RRHH
    </button>

    <button
      class="nav-button"
      data-module="compras"
    >
      🛒 Compras
    </button>

    <button
      class="nav-button"
      data-module="facturacion"
    >
      🧾 Facturación
    </button>

    <button
      class="nav-button"
      data-module="administracion"
    >
      📊 Administración
    </button>

  </nav>

</header>


<!-- =========================================
     CONTENEDOR SPA
========================================= -->

<main id="app"></main>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="./js/config.js"></script>

<script src="./js/api.js"></script>

<script src="./js/navigation.js"></script>

<script src="./js/app.js"></script>


</body>

</html>
