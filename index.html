
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Geriátrico | Sistema</title>

<link
  rel="stylesheet"
  href="./css/app.css"
>

</head>

<body>


<!-- =========================================
     BARRA DE NAVEGACIÓN
========================================= -->

<header class="navbar">

  <div class="brand">

    <img
      src="./img/logo.jpg"
      alt=""
    >

    <strong>
      INDIGO
    </strong>

  </div>

<div class="theme-switch">

  <span class="theme-icon">
    ☀️
  </span>

  <label class="switch">

    <input
      type="checkbox"
      id="darkModeToggle"
    >

    <span class="slider"></span>

  </label>

  <span class="theme-icon">
    🌙
  </span>

</div>
  <!--
    La navegación se construye dinámicamente
    desde app.js según los permisos del usuario.
  -->

  <nav
    id="navigation"
    class="nav"
  ></nav>

</header>



<!-- =========================================
     ZONA PRINCIPAL
========================================= -->

<div class="main-area">


  <!-- =======================================
       BARRA DE SESIÓN
  ======================================== -->

  <div
    id="sessionBar"
    class="session-bar"
  >

    <div class="session-user">

      <span class="session-label">
        Usuario
      </span>

      <strong id="sessionUser">
        —
      </strong>

    </div>


    <div class="session-user">

      <span class="session-label">
        Rol
      </span>

      <strong id="sessionRole">
        —
      </strong>

    </div>


    <div class="session-time">

      <span class="session-label">
        Tiempo
      </span>

      <strong
        id="sessionTimer"
        class="session-timer"
      >
        —
      </strong>

    </div>


    <button
      id="sessionLogout"
      class="session-logout"
    >
      Cerrar sesión
    </button>

  </div>


  <!-- =======================================
       CONTENEDOR SPA
  ======================================== -->

  <main id="app"></main>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="./js/config.js"></script>

<script src="./js/api.js"></script>

<script src="./js/navigation.js"></script>

<script src="./js/app.js"></script>

<script src="js/include.js"></script>

<script>
  initializeTheme();
</script>

<!-- =========================================
     COMPONENTES GOBALES
========================================= -->

<div include="components/loadingModal.html"></div>







</body>

</html>
