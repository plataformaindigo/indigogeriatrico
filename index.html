<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Prueba autenticación</title>


<style>

/* =========================
   GENERAL
========================= */

* {

  box-sizing: border-box;

}


body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f2f4f7;

}


/* =========================
   APP
========================= */

#app {

  padding: 40px;

}


/* =========================
   MODAL BLOQUEO
========================= */

#lockScreen {

  position: fixed;

  inset: 0;

  background:
    rgba(0, 0, 0, 0.78);

  display: flex;

  align-items: center;

  justify-content: center;

  z-index: 9999;

}


/* =========================
   LOGIN
========================= */

#loginBox {

  width: 320px;

  max-width: calc(100% - 30px);

  background:
    white;

  padding: 30px;

  border-radius: 12px;

  box-shadow:
    0 10px 40px
    rgba(0, 0, 0, 0.3);

}


#loginBox h2 {

  margin-top: 0;

}


input {

  width: 100%;

  padding: 12px;

  margin-bottom: 12px;

  font-size: 16px;

  border:
    1px solid #ccc;

  border-radius: 6px;

}


button {

  width: 100%;

  padding: 12px;

  font-size: 16px;

  cursor: pointer;

  border: none;

  border-radius: 6px;

}


button + button {

  margin-top: 10px;

}


#message {

  margin-top: 15px;

  min-height: 20px;

}


/* =========================
   INFORMACIÓN SESIÓN
========================= */

#sessionInfo {

  margin-bottom: 20px;

  padding: 15px;

  background:
    white;

  border-radius: 8px;

}

</style>

</head>


<body>


<!-- =========================
     PANTALLA BLOQUEADA
========================= -->

<div id="lockScreen">

  <div id="loginBox">

    <h2>Acceso</h2>

    <p>
      Ingrese sus credenciales.
    </p>


    <input
      id="usuario"
      type="text"
      placeholder="Usuario"
      autocomplete="username"
    >


    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >


    <button
      onclick="login()"
    >
      Ingresar
    </button>


    <div id="message"></div>

  </div>

</div>


<!-- =========================
     APLICACIÓN
========================= -->

<div id="app">

  <h1>
    Sistema geriátrico
  </h1>


  <div id="sessionInfo">

    Sesión no iniciada.

  </div>


  <button
    onclick="probarAccion()"
  >
    Probar acción protegida
  </button>


  <br><br>


  <button
    onclick="logout()"
  >
    Cerrar sesión
  </button>

</div>


<script>

/* =========================
   CONFIGURACIÓN
========================= */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbxifPJ4Q8x-_-IlJgFL0tIQXFbaFQePPQPBrlLpy0UqrGKSGGehrW-GBNofdffH7uUS/exec';


/* =========================
   SESIÓN
========================= */

window.user_sessionToken =
  null;


window.user_session =
  null;


/* =========================
   LOGIN
========================= */

async function login() {

  const usuario =
    document
      .getElementById('usuario')
      .value
      .trim();


  const passwordInput =
    document
      .getElementById('password');


  const password =
    passwordInput.value;


  const message =
    document
      .getElementById('message');


  if (!usuario || !password) {

    message.textContent =
      'Ingrese usuario y contraseña.';

    return;

  }


  message.textContent =
    'Verificando...';


  try {

    const response =
      await fetch(

        GAS_URL,

        {

          method: 'POST',

          redirect: 'follow',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'login',

              usuario:
                usuario,

              password:
                password

            })

        }

      );


    const result =
      await response.json();


    /*
      Eliminamos inmediatamente
      la contraseña del input.
    */

    passwordInput.value = '';


    if (!result.ok) {

      message.textContent =
        'Acceso rechazado.';

      return;

    }


    /*
      GUARDAMOS SOLAMENTE
      EL TOKEN DE SESIÓN.
    */

    window.user_sessionToken =
      result.token;


    window.user_session = {

      id:
        result.user.id,

      usuario:
        result.user.usuario,

      rol:
        result.user.rol,

      expiresAt:
        result.expiresAt

    };


    /*
      Desbloquear aplicación.
    */

    document
      .getElementById('lockScreen')
      .style.display = 'none';


    /*
      Mostrar información.
    */

    document
      .getElementById('sessionInfo')
      .innerHTML = `

        <strong>
          Sesión activa
        </strong>

        <br><br>

        Usuario:
        ${escapeHtml(
          result.user.usuario
        )}

        <br>

        Rol:
        ${escapeHtml(
          result.user.rol
        )}

        <br>

        Expira:
        ${escapeHtml(
          result.expiresAt
        )}

      `;


    message.textContent =
      '';

  }


  catch (error) {

    console.error(error);

    passwordInput.value = '';

    message.textContent =
      'Error de conexión.';

  }

}


/* =========================
   ACCIÓN PROTEGIDA
========================= */

async function probarAccion() {

  if (
    !window.user_sessionToken ||
    !window.user_session
  ) {

    bloquearSesion(
      'No existe una sesión válida.'
    );

    return;

  }


  try {

    const response =
      await fetch(

        GAS_URL,

        {

          method: 'POST',

          redirect: 'follow',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'test',

              usuario:
                window.user_session.usuario,

              token:
                window.user_sessionToken

            })

        }

      );


    const result =
      await response.json();


    if (!result.ok) {

      bloquearSesion(
        'Sesión inválida o expirada.'
      );

      return;

    }


    alert(

      result.message +

      '\n\nUsuario: ' +
      result.user +

      '\nRol: ' +
      result.rol +

      '\n\n' +
      result.timestamp

    );

  }


  catch (error) {

    console.error(error);

    alert(
      'Error de conexión.'
    );

  }

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  if (
    window.user_sessionToken &&
    window.user_session
  ) {

    try {

      await fetch(

        GAS_URL,

        {

          method: 'POST',

          redirect: 'follow',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'logout',

              usuario:
                window.user_session.usuario,

              token:
                window.user_sessionToken

            })

          }

        );

    }

    catch (error) {

      console.error(error);

    }

  }


  bloquearSesion();

}


/* =========================
   BLOQUEAR
========================= */

function bloquearSesion(mensaje) {

  window.user_sessionToken =
    null;


  window.user_session =
    null;


  document
    .getElementById('lockScreen')
    .style.display = 'flex';


  document
    .getElementById('sessionInfo')
    .textContent =
      'Sesión no iniciada.';


  if (mensaje) {

    document
      .getElementById('message')
      .textContent =
        mensaje;

  }

}


/* =========================
   ESCAPAR HTML
========================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      '&',
      '&amp;'
    )

    .replaceAll(
      '<',
      '&lt;'
    )

    .replaceAll(
      '>',
      '&gt;'
    )

    .replaceAll(
      '"',
      '&quot;'
    )

    .replaceAll(
      "'",
      '&#039;'
    );

}

</script>

</body>

</html>
