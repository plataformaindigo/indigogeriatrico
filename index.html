<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Geriátrico | Sistema</title>

<link
  rel="stylesheet"
  href="./css/app.css"
>

</head>

<body>


<!-- =========================================
     BARRA DE NAVEGACIÓN
========================================= -->

<header class="navbar">

  <div class="brand">

    <img
      src="./img/logo.jpg"
      alt=""
    >

    <strong>
      INDIGO
    </strong>

  </div>


  <nav
    id="navigation"
    class="nav"
  >

    <button
      class="nav-button"
      data-module="ocupacion"
    >
      🛏️ Ocupación
    </button>

    <button
      class="nav-button"
      data-module="pacientes"
    >
      👥 Pacientes
    </button>

    <button
      class="nav-button"
      data-module="enfermeria"
    >
      🩺 Enfermería
    </button>

    <button
      class="nav-button"
      data-module="farmacia"
    >
      💊 Farmacia
    </button>

    <button
      class="nav-button"
      data-module="cocina"
    >
      🍽️ Cocina
    </button>

    <button
      class="nav-button"
      data-module="nutricion"
    >
      🥗 Nutrición
    </button>

    <button
      class="nav-button"
      data-module="profesionales"
    >
      👨‍⚕️ Profesionales
    </button>

    <button
      class="nav-button"
      data-module="rrhh"
    >
      👔 RRHH
    </button>

    <button
      class="nav-button"
      data-module="compras"
    >
      🛒 Compras
    </button>

    <button
      class="nav-button"
      data-module="facturacion"
    >
      🧾 Facturación
    </button>

    <button
      class="nav-button"
      data-module="administracion"
    >
      📊 Administración
    </button>

  </nav>

</header>


<!-- =========================================
     ZONA PRINCIPAL
========================================= -->

<div class="main-area">


  <!-- =======================================
       BARRA DE SESIÓN
  ======================================== -->

  <div
    id="sessionBar"
    class="session-bar"
  >

    <div class="session-user">

      <span class="session-label">
        Usuario
      </span>

      <strong id="sessionUser">
        —
      </strong>

    </div>


    <div class="session-user">

      <span class="session-label">
        Rol
      </span>

      <strong id="sessionRole">
        —
      </strong>

    </div>


    <div class="session-time">

      <span class="session-label">
        Tiempo
      </span>

      <strong
        id="sessionTimer"
        class="session-timer"
      >
        —
      </strong>

    </div>


    <button
      id="sessionLogout"
      class="session-logout"
    >
      Cerrar sesión
    </button>

  </div>


  <!-- =======================================
       CONTENEDOR SPA
  ======================================== -->

  <main id="app"></main>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="./js/config.js"></script>

<script src="./js/api.js"></script>

<script src="./js/navigation.js"></script>

<script src="./js/app.js"></script>


</body>

</html>
