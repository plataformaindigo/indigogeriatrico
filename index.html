
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Geriátrico | Sistema</title>

<link
  rel="stylesheet"
  href="./css/app.css"
>

</head>

<body>


<!-- =========================================
     BARRA DE NAVEGACIÓN
========================================= -->

<header class="navbar">

  <div class="brand">

    <img
      src="./img/logo.jpg"
      alt=""
    >

    <strong>
      INDIGO
    </strong>

  </div>


  <!--
    La navegación se construye dinámicamente
    desde app.js según los permisos del usuario.
  -->

  <nav
    id="navigation"
    class="nav"
  ></nav>

</header>


<!-- =========================================
     ZONA PRINCIPAL
========================================= -->

<div class="main-area">


  <!-- =======================================
       BARRA DE SESIÓN
  ======================================== -->

  <div
    id="sessionBar"
    class="session-bar"
  >

    <div class="session-user">

      <span class="session-label">
        Usuario
      </span>

      <strong id="sessionUser">
        —
      </strong>

    </div>


    <div class="session-user">

      <span class="session-label">
        Rol
      </span>

      <strong id="sessionRole">
        —
      </strong>

    </div>


    <div class="session-time">

      <span class="session-label">
        Tiempo
      </span>

      <strong
        id="sessionTimer"
        class="session-timer"
      >
        —
      </strong>

    </div>


    <button
      id="sessionLogout"
      class="session-logout"
    >
      Cerrar sesión
    </button>

  </div>


  <!-- =======================================
       CONTENEDOR SPA
  ======================================== -->

  <main id="app"></main>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="./js/config.js"></script>

<script src="./js/api.js"></script>

<script src="./js/navigation.js"></script>

<script src="./js/app.js"></script>

<div id="loadingModalContainer"></div>

<script>
async function loadLoadingModal() {

  try {

    const response = await fetch(
      './components/loadingModal.html'
    );

    if (!response.ok) {
      throw new Error(
        'No se pudo cargar loadingModal.html'
      );
    }

    const html =
      await response.text();

    const container =
      document.getElementById(
        'loadingModalContainer'
      );

    container.innerHTML = html;


    /*
     * Ejecutar los <script>
     * que vienen dentro del HTML
     */

    const scripts =
      container.querySelectorAll(
        'script'
      );

    scripts.forEach(oldScript => {

      const newScript =
        document.createElement(
          'script'
        );

      if (oldScript.src) {

        newScript.src =
          oldScript.src;

      }
      else {

        newScript.textContent =
          oldScript.textContent;

      }

      document.body.appendChild(
        newScript
      );

    });

  }

  catch (error) {

    console.error(
      'LoadingModal:',
      error
    );

  }

}


loadLoadingModal();
</script>


</body>

</html>
