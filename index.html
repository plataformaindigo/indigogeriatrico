```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Geriátrico | Sistema</title>

<link
  rel="stylesheet"
  href="./css/app.css"
>

</head>

<body>


<!-- =========================================
     BARRA DE NAVEGACIÓN
========================================= -->

<header class="navbar">

  <div class="brand">

    <img
      src="./img/logo.jpg"
      alt=""
    >

    <strong>
      INDIGO
    </strong>

  </div>


  <nav
    id="navigation"
    class="nav"
  >

    <button
      class="nav-button"
      data-module="ocupacion"
    >
      🛏️ Ocupación
    </button>

    <button
      class="nav-button"
      data-module="pacientes"
    >
      👥 Pacientes
    </button>

    <button
      class="nav-button"
      data-module="enfermeria"
    >
      🩺 Enfermería
    </button>

    <button
      class="nav-button"
      data-module="farmacia"
    >
      💊 Farmacia
    </button>

    <button
      class="nav-button"
      data-module="cocina"
    >
      🍽️ Cocina
    </button>

    <button
      class="nav-button"
      data-module="nutricion"
    >
      🥗 Nutrición
    </button>

    <button
      class="nav-button"
      data-module="profesionales"
    >
      👨‍⚕️ Profesionales
    </button>

    <button
      class="nav-button"
      data-module="rrhh"
    >
      👔 RRHH
    </button>

    <button
      class="nav-button"
      data-module="compras"
    >
      🛒 Compras
    </button>

    <button
      class="nav-button"
      data-module="facturacion"
    >
      🧾 Facturación
    </button>

    <button
      class="nav-button"
      data-module="administracion"
    >
      📊 Administración
    </button>

  </nav>

</header>


<!-- =========================================
     ZONA PRINCIPAL
========================================= -->

<div class="main-area">


  <!-- =======================================
       BARRA DE SESIÓN
  ======================================== -->

  <section
    id="sessionBar"
    class="session-bar"
  >

    <div class="session-status">

      <span
        id="statusDot"
        class="session-dot offline"
      ></span>

      <span
        id="status"
        class="session-status-text"
      >
        Sin sesión
      </span>

    </div>


    <div class="session-data">

      <div class="session-item">

        <span class="session-label">
          Usuario
        </span>

        <span
          id="userInfo"
          class="session-value"
        >
          —
        </span>

      </div>


      <div class="session-divider"></div>


      <div class="session-item">

        <span class="session-label">
          Rol
        </span>

        <span
          id="roleInfo"
          class="session-value"
        >
          —
        </span>

      </div>


      <div class="session-divider"></div>


      <div class="session-item">

        <span class="session-label">
          Tiempo
        </span>

        <span
          id="timer"
          class="session-value session-timer"
        >
          —
        </span>

      </div>

    </div>


    <button
      id="logoutButton"
      class="session-logout"
      disabled
    >
      Cerrar sesión
    </button>

  </section>


  <!-- =======================================
       CONTENEDOR SPA
  ======================================== -->

  <main id="app"></main>


</div>


<!-- =========================================
     LOGIN MODAL
========================================= -->

<div
  id="loginModal"
  class="modal"
>

  <div class="login">

    <h2>
      Iniciar sesión
    </h2>

    <p>
      Ingresá tus credenciales para acceder al sistema.
    </p>


    <div class="field">

      <label for="usuario">
        Usuario
      </label>

      <input
        id="usuario"
        type="text"
        autocomplete="username"
      >

    </div>


    <div class="field">

      <label for="password">
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

    </div>


    <button
      id="loginButton"
      class="primary"
    >
      Iniciar sesión
    </button>


    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="./js/config.js"></script>

<script src="./js/api.js"></script>

<script src="./js/navigation.js"></script>

<script src="./js/app.js"></script>


</body>

</html>
```
