<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Autenticación | Prueba</title>


<style>

:root {

  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --success: #16a34a;
  --danger: #dc2626;
  --border: #e2e8f0;

}


* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at top right,
      #dbeafe,
      transparent 35%
    ),
    var(--bg);

  color: var(--text);

}


.container {

  width:
    min(
      900px,
      calc(100% - 32px)
    );

  margin: auto;

  padding:
    45px 0;

}


h1 {

  margin: 0;

  font-size: 38px;

  letter-spacing: -.03em;

}


.subtitle {

  color: var(--muted);

  margin:
    8px 0 28px;

}


.card {

  background: var(--card);

  border:
    1px solid var(--border);

  border-radius: 18px;

  padding: 25px;

  margin-bottom: 18px;

  box-shadow:
    0 15px 40px
    rgba(15,23,42,.08);

}


.grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;

}


.info {

  background: #f8fafc;

  border:
    1px solid var(--border);

  border-radius: 12px;

  padding: 15px;

}


.label {

  color: var(--muted);

  font-size: 11px;

  font-weight: 800;

  text-transform: uppercase;

  margin-bottom: 6px;

}


.value {

  font-weight: 700;

  word-break: break-word;

}


.timer {

  font-size: 25px;

}


.actions {

  display: flex;

  flex-wrap: wrap;

  gap: 10px;

  margin-top: 20px;

}


button {

  border: 0;

  border-radius: 10px;

  padding:
    12px 17px;

  font-weight: 700;

  cursor: pointer;

}


.primary {

  background:
    var(--primary);

  color: white;

}


.secondary {

  background:
    #e2e8f0;

  color:
    #334155;

}


.danger {

  background:
    #fee2e2;

  color:
    #991b1b;

}


button:disabled {

  opacity: .5;

  cursor:
    not-allowed;

}


.status {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  padding:
    7px 11px;

  border-radius:
    999px;

  font-size: 12px;

  font-weight: 800;

}


.status::before {

  content: "";

  width: 8px;

  height: 8px;

  border-radius: 50%;

  background: currentColor;

}


.status.offline {

  background:
    #f1f5f9;

  color:
    #64748b;

}


.status.online {

  background:
    #dcfce7;

  color:
    #166534;

}


.status.expired {

  background:
    #fee2e2;

  color:
    #991b1b;

}


.log {

  background:
    #0f172a;

  color:
    #dbeafe;

  border-radius: 12px;

  padding: 15px;

  min-height: 180px;

  max-height: 300px;

  overflow: auto;

  font-family:
    Consolas,
    monospace;

  font-size: 12px;

  line-height: 1.6;

}


/* =========================================
   MODAL
========================================= */

.modal {

  position: fixed;

  inset: 0;

  z-index: 9999;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(15,23,42,.72);

  backdrop-filter:
    blur(12px);

}


.login {

  width:
    min(
      410px,
      100%
    );

  background:
    white;

  border-radius:
    22px;

  padding:
    30px;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.25);

}


.login h2 {

  margin:
    0 0 8px;

}


.login p {

  color:
    var(--muted);

  font-size:
    14px;

  line-height:
    1.5;

}


.field {

  margin-top:
    15px;

}


label {

  display:
    block;

  margin-bottom:
    7px;

  font-size:
    13px;

  font-weight:
    700;

}


input {

  width:
    100%;

  padding:
    13px;

  border:
    1px solid var(--border);

  border-radius:
    10px;

  font-size:
    15px;

  outline:
    none;

}


input:focus {

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}


.login button {

  width:
    100%;

  margin-top:
    20px;

}


.error {

  display:
    none;

  margin-top:
    12px;

  padding:
    10px;

  border-radius:
    9px;

  background:
    #fee2e2;

  color:
    #991b1b;

  font-size:
    13px;

  font-weight:
    600;

}


@media (max-width:700px) {

  .container {

    width:
      calc(100% - 20px);

    padding:
      25px 0;

  }


  .grid {

    grid-template-columns:
      1fr;

  }


  h1 {

    font-size:
      30px;

  }

}

</style>

</head>


<body>


<!-- ======================================
     LOGIN
======================================= -->

<div
  id="loginModal"
  class="modal"
>

  <div class="login">

    <h2>
      Iniciar sesión
    </h2>

    <p>
      Prueba del sistema de autenticación.
    </p>


    <div class="field">

      <label>
        Usuario
      </label>

      <input
        id="usuario"
        type="text"
        autocomplete="username"
        placeholder="admin"
      >

    </div>


    <div class="field">

      <label>
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
      >

    </div>


    <button
      id="loginButton"
      class="primary"
      onclick="login()"
    >
      Iniciar sesión
    </button>


    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</div>


<!-- ======================================
     CONTENIDO
======================================= -->

<main class="container">

  <h1>
    Autenticación
  </h1>

  <p class="subtitle">
    Prueba de sesión única y validación de token.
  </p>


  <section class="card">

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:15px;
        margin-bottom:20px;
      "
    >

      <h2 style="margin:0">
        Sesión actual
      </h2>

      <span
        id="status"
        class="status offline"
      >
        Sin sesión
      </span>

    </div>


    <div class="grid">


      <div class="info">

        <div class="label">
          Usuario
        </div>

        <div
          id="userInfo"
          class="value"
        >
          —
        </div>

      </div>


      <div class="info">

        <div class="label">
          Rol
        </div>

        <div
          id="roleInfo"
          class="value"
        >
          —
        </div>

      </div>


      <div class="info">

        <div class="label">
          Tiempo restante
        </div>

        <div
          id="timer"
          class="value timer"
        >
          —
        </div>

      </div>


      <div class="info">

        <div class="label">
          Token
        </div>

        <div
          id="tokenInfo"
          class="value"
        >
          —
        </div>

      </div>


      <div class="info">

        <div class="label">
          Expira
        </div>

        <div
          id="expiresInfo"
          class="value"
        >
          —
        </div>

      </div>


      <div class="info">

        <div class="label">
          Última validación
        </div>

        <div
          id="validationInfo"
          class="value"
        >
          —
        </div>

      </div>

    </div>


    <div class="actions">

      <button
        id="validateButton"
        class="secondary"
        onclick="validateSession()"
        disabled
      >
        Validar sesión
      </button>


      <button
        id="actionButton"
        class="primary"
        onclick="protectedAction()"
        disabled
      >
        Acción protegida
      </button>


      <button
        id="logoutButton"
        class="danger"
        onclick="logout()"
        disabled
      >
        Cerrar sesión
      </button>

    </div>

  </section>


  <section class="card">

    <h2>
      Registro
    </h2>

    <div
      id="log"
      class="log"
    ></div>

  </section>

</main>


<script>


/* =========================================
   CONFIGURACIÓN
========================================= */


/*
 * PEGAR AQUÍ LA URL /exec DE GAS
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxJ_wrjMljA1udy1B-9qk2e3vCo2alDTKLSBgBemTY8dxwyn0FY0AtSbLBpBTpstsqABQ/exec';



/*
 * Sesión exclusivamente en memoria.
 */

window.session =
  null;


let countdownInterval =
  null;

let validationInterval =
  null;


/* =========================================
   API
========================================= */

async function api(data) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );

  }


  return response.json();

}


/* =========================================
   LOG
========================================= */

function writeLog(
  message,
  type = ''
) {

  const log =
    document.getElementById(
      'log'
    );


  const line =
    document.createElement(
      'div'
    );


  const time =
    new Date()
      .toLocaleTimeString();


  line.textContent =
    `[${time}] ${message}`;


  if (type) {

    line.style.color =
      type === 'error'
        ? '#fca5a5'
        : '#86efac';

  }


  log.appendChild(
    line
  );


  log.scrollTop =
    log.scrollHeight;

}


/* =========================================
   LOGIN
========================================= */

async function login() {

  const usuario =
    document
      .getElementById(
        'usuario'
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        'password'
      )
      .value;


  const error =
    document
      .getElementById(
        'loginError'
      );


  error.style.display =
    'none';


  if (
    !usuario ||
    !password
  ) {

    showError(
      'Ingresá usuario y contraseña.'
    );

    return;

  }


  const button =
    document.getElementById(
      'loginButton'
    );


  button.disabled =
    true;

  button.textContent =
    'Verificando...';


  try {

    writeLog(
      `Intentando login como ${usuario}...`
    );


    const result =
      await api({

        action:
          'login',

        usuario:
          usuario,

        password:
          password

      });


    if (!result.ok) {

      showError(
        translateError(
          result.error
        )
      );


      writeLog(
        `Login rechazado: ${result.error}`,
        'error'
      );


      return;

    }


    /*
     * El password desaparece de esta función.
     *
     * Solamente guardamos:
     *
     * token
     * usuario
     * rol
     * expiración
     */

    window.session = {

      token:
        result.token,

      user:
        result.user,

      expiresAt:
        result.expiresAt

    };


    /*
     * Limpiar password del input.
     */

    document
      .getElementById(
        'password'
      )
      .value =
      '';


    writeLog(
      'Login correcto.',
      'success'
    );


    writeLog(
      'Token de sesión recibido.',
      'success'
    );


    document
      .getElementById(
        'loginModal'
      )
      .style.display =
      'none';


    updateUI();

    startTimers();

  }

  catch (error) {

    console.error(error);


    showError(
      'No se pudo completar la operación.'
    );


    writeLog(
      error.message,
      'error'
    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      'Iniciar sesión';

  }

}


/* =========================================
   VALIDAR
========================================= */

async function validateSession(
  silent = false
) {

  if (!window.session) {

    return false;

  }


  try {

    const result =
      await api({

        action:
          'validate',

        usuario:
          window.session.user.usuario,

        token:
          window.session.token

      });


    document
      .getElementById(
        'validationInfo'
      )
      .textContent =
      new Date()
        .toLocaleTimeString();


    if (!result.ok) {

      writeLog(
        'Servidor rechazó la sesión.',
        'error'
      );


      sessionInvalid(
        'La sesión fue invalidada o expiró.'
      );


      return false;

    }


    writeLog(
      silent
        ? 'Validación automática OK.'
        : 'Sesión válida.',
      'success'
    );


    return true;

  }

  catch (error) {

    writeLog(
      `Error de validación: ${error.message}`,
      'error'
    );


    return false;

  }

}


/* =========================================
   ACCIÓN PROTEGIDA
========================================= */

async function protectedAction() {

  const valid =
    await validateSession();


  if (!valid) {

    return;

  }


  writeLog(
    `✓ Acción protegida autorizada para ${window.session.user.usuario}.`,
    'success'
  );

}


/* =========================================
   LOGOUT
========================================= */

async function logout() {

  if (!window.session) {

    return;

  }


  try {

    await api({

      action:
        'logout',

      usuario:
        window.session.user.usuario,

      token:
        window.session.token

    });


    writeLog(
      'Logout realizado.',
      'success'
    );

  }

  catch (error) {

    writeLog(
      `Error en logout: ${error.message}`,
      'error'
    );

  }

  finally {

    clearSession();

  }

}


/* =========================================
   SESIÓN INVALIDADA
========================================= */

function sessionInvalid(
  message
) {

  writeLog(
    message,
    'error'
  );


  clearSession();


  document
    .getElementById(
      'loginModal'
    )
    .style.display =
    'flex';


  showError(
    message
  );

}


/* =========================================
   LIMPIAR
========================================= */

function clearSession() {

  window.session =
    null;


  if (
    countdownInterval
  ) {

    clearInterval(
      countdownInterval
    );

  }


  if (
    validationInterval
  ) {

    clearInterval(
      validationInterval
    );

  }


  countdownInterval =
    null;

  validationInterval =
    null;


  updateUI();


  document
    .getElementById(
      'timer'
    )
    .textContent =
    '—';

}


/* =========================================
   TEMPORIZADORES
========================================= */

function startTimers() {

  if (
    countdownInterval
  ) {

    clearInterval(
      countdownInterval
    );

  }


  if (
    validationInterval
  ) {

    clearInterval(
      validationInterval
    );

  }


  countdownInterval =
    setInterval(
      updateTimer,
      1000
    );


  /*
   * Cada 30 segundos verificamos
   * realmente contra la Sheet.
   */

  validationInterval =
    setInterval(
      () => {

        validateSession(true);

      },
      30000
    );


  updateTimer();

}


/* =========================================
   TIMER
========================================= */

function updateTimer() {

  if (!window.session) {

    return;

  }


  const expires =
    new Date(
      window.session.expiresAt
    ).getTime();


  const remaining =
    expires -
    Date.now();


  if (
    remaining <= 0
  ) {

    document
      .getElementById(
        'timer'
      )
      .textContent =
      '00:00';


    sessionInvalid(
      'La sesión expiró.'
    );


    return;

  }


  const seconds =
    Math.floor(
      remaining / 1000
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  document
    .getElementById(
      'timer'
    )
    .textContent =

    String(minutes)
      .padStart(2, '0')

    + ':'

    +

    String(secs)
      .padStart(2, '0');

}


/* =========================================
   UI
========================================= */

function updateUI() {

  const active =
    !!window.session;


  const status =
    document.getElementById(
      'status'
    );


  const validateButton =
    document.getElementById(
      'validateButton'
    );


  const actionButton =
    document.getElementById(
      'actionButton'
    );


  const logoutButton =
    document.getElementById(
      'logoutButton'
    );


  if (!active) {

    status.className =
      'status offline';

    status.textContent =
      'Sin sesión';


    validateButton.disabled =
      true;

    actionButton.disabled =
      true;

    logoutButton.disabled =
      true;


    document
      .getElementById(
        'userInfo'
      )
      .textContent =
      '—';


    document
      .getElementById(
        'roleInfo'
      )
      .textContent =
      '—';


    document
      .getElementById(
        'tokenInfo'
      )
      .textContent =
      '—';


    document
      .getElementById(
        'expiresInfo'
      )
      .textContent =
      '—';


    return;

  }


  status.className =
    'status online';

  status.textContent =
    'Sesión activa';


  validateButton.disabled =
    false;

  actionButton.disabled =
    false;

  logoutButton.disabled =
    false;


  document
    .getElementById(
      'userInfo'
    )
    .textContent =
    window.session.user.usuario;


  document
    .getElementById(
      'roleInfo'
    )
    .textContent =
    window.session.user.rol;


  document
    .getElementById(
      'tokenInfo'
    )
    .textContent =
    maskToken(
      window.session.token
    );


  document
    .getElementById(
      'expiresInfo'
    )
    .textContent =
    new Date(
      window.session.expiresAt
    )
    .toLocaleString();

}


/* =========================================
   TOKEN
========================================= */

function maskToken(
  token
) {

  if (!token) {

    return '—';

  }


  return (

    token.substring(
      0,
      6
    )

    +

    '••••••••••'

    +

    token.substring(
      token.length - 6
    )

  );

}


/* =========================================
   ERROR
========================================= */

function showError(
  message
) {

  const element =
    document
      .getElementById(
        'loginError'
      );


  element.textContent =
    message;


  element.style.display =
    'block';

}


/* =========================================
   ERRORES
========================================= */

function translateError(
  error
) {

  const errors = {

    MISSING_CREDENTIALS:
      'Ingresá usuario y contraseña.',

    INVALID_CREDENTIALS:
      'Usuario o contraseña incorrectos.',

    USER_INACTIVE:
      'El usuario está inactivo.',

    NO_USERS:
      'No hay usuarios configurados.',

    SESSION_INVALID:
      'La sesión no es válida.'

  };


  return (
    errors[error] ||
    error ||
    'Error desconocido.'
  );

}


/* =========================================
   ENTER
========================================= */

document
  .getElementById(
    'password'
  )
  .addEventListener(
    'keydown',
    event => {

      if (
        event.key === 'Enter'
      ) {

        login();

      }

    }
  );


/* =========================================
   INICIO
========================================= */

writeLog(
  'Aplicación iniciada.'
);

writeLog(
  'Esperando autenticación.'
);

</script>

</body>

</html>
